name: Value Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Each JDK reports for itself: one failing does not hide the other.
      fail-fast: false
      matrix:
        java-version: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v7

      # The wrapper jar is the one binary in the repository: check it is Gradle's.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: gradle

      # Compiles, runs the tests against the conformance vectors and the
      # committed golden corpus, and checks the Android API level.
      - name: Build
        run: ./gradlew build

      - name: Keep the test report of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-jdk${{ matrix.java-version }}
          path: build/reports/tests/test
          retention-days: 7

  # The same tests against a corpus the Go implementation writes on the spot,
  # many times the size of the committed one.
  conformance:
    runs-on: ubuntu-latest
    env:
      # go.arpabet.com modules are fetched from their source, not from Google's
      # module proxy.
      GOPRIVATE: go.arpabet.com/*
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: conformance/go.mod
          cache-dependency-path: conformance/go.sum

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The corpus in the repository is what the generator writes: a change of
      # the generator, or of the Go implementation it calls, shows here as a
      # diff, to be committed with `cd conformance && go run .`.
      - name: The committed corpus is up to date
        working-directory: conformance
        run: |
          go vet ./...
          go run .
          if [ -n "$(git status --porcelain -- ../src/test/resources/golden)" ]; then
            git status --short -- ../src/test/resources/golden
            git diff --stat -- ../src/test/resources/golden
            echo "::error::the golden corpus is not what the generator writes: run 'cd conformance && go run .' and commit the result"
            exit 1
          fi

      - name: Write a large corpus with the Go implementation
        working-directory: conformance
        run: go run . -out "$RUNNER_TEMP/golden" -scale 40

      - name: Check the Java implementation against it
        run: ./gradlew test -PgoldenDir="$RUNNER_TEMP/golden"
